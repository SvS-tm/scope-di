<svg width="1400" height="500" viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">react-scope-di</title>
  <desc id="description">HOC-first React dependency injection for scope-di with typed props, async dependencies, and scoped component trees.</desc>

  <rect width="1400" height="500" rx="32" fill="#ffffff"/>
  <rect x="1" y="1" width="1398" height="498" rx="31" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <g transform="translate(92 98) scale(0.304)">
    <rect width="1000" height="1000" fill="white"/>
    <polygon points="800,500 775,475 750,500 775,525" fill="#111827"/>
    <polygon points="625,625 350,350 500,200 650,350 625,375 500,250 400,350 675,625" fill="#111827"/>
    <polygon points="250,500 200,500 500,800 675,625 625,625 500,750" fill="#111827"/>
    <polygon points="150,500 100,500 500,100 900,500 850,500 500,150" fill="#111827"/>
    <polygon points="150,500 100,500 500,900 900,500 850,500 500,850" fill="#111827"/>
    <polygon points="0,500 50,500 500,950 950,500 1000,500 500,1000" fill="#111827"/>
  </g>

  <g transform="translate(470 84)">
    <text x="0" y="78" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="74" font-weight="760" letter-spacing="0">react-scope-di</text>
    <text x="2" y="136" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="500" letter-spacing="0">HOC-first dependency injection for React</text>

    <g transform="translate(0 178)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="620">
      <rect x="0" y="0" width="144" height="48" rx="24" fill="#f3f4f6"/>
      <text x="24" y="31" fill="#111827">HOC-first</text>

      <rect x="162" y="0" width="206" height="48" rx="24" fill="#f3f4f6"/>
      <text x="186" y="31" fill="#111827">typed props</text>

      <rect x="386" y="0" width="292" height="48" rx="24" fill="#f3f4f6"/>
      <text x="410" y="31" fill="#111827">async dependencies</text>

      <rect x="0" y="70" width="206" height="48" rx="24" fill="#f3f4f6"/>
      <text x="24" y="101" fill="#111827">Suspense-ready</text>

      <rect x="224" y="70" width="314" height="48" rx="24" fill="#f3f4f6"/>
      <text x="248" y="101" fill="#111827">scoped component trees</text>
    </g>
  </g>

  <text x="700" y="448" text-anchor="middle" fill="#6b7280" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="680" letter-spacing="0">Dependencies stay out of your public component props.</text>
</svg>
