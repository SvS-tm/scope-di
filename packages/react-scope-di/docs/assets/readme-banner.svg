<svg width="1400" height="500" viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">react-scope-di</title>
  <desc id="description">HOC-first React dependency injection for scope-di with typed props, async dependencies, and scoped component trees.</desc>

  <rect width="1400" height="500" rx="32" fill="#2D2D2D"/>
  <rect x="1" y="1" width="1398" height="498" rx="31" fill="none" stroke="#3A3A3A" stroke-width="2"/>
  <rect x="32" y="32" width="1336" height="436" rx="24" fill="#242424" opacity="0.72"/>

  <g transform="translate(92 98) scale(0.27636)">
    <circle cx="550" cy="550" r="540" fill="#191A1B" stroke="#000000" stroke-width="20"/>
    <path d="M 108.145 551 L 58.145 551 L 550 58.145 L 1041.855 551 L 991.855 551 L 550 108.145 Z M 8 550 L 108 550 L 550 975 L 992 550 L 1092 550 L 550 1075 Z" fill="#d8dee9"/>
    <path d="M 688 383 L 550 245 L 425 370 L 725 670 L 550 845" fill="none" stroke="#61afef" stroke-width="79.54875" stroke-linecap="square" stroke-linejoin="miter"/>
    <polygon points="203.75,555 316.25,555 578.125,816.875 521.875,873.125" fill="#61afef"/>
    <rect x="807.225625" y="502.225625" width="79.54875" height="79.54875" fill="#61afef" transform="rotate(45 847 542)"/>
  </g>

  <g transform="translate(470 84)">
    <text x="0" y="78" fill="#d8dee9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="74" font-weight="760" letter-spacing="0">react-scope-di</text>
    <text x="2" y="136" fill="#9ca3af" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="500" letter-spacing="0">HOC-first dependency injection for React</text>

    <g transform="translate(0 180)" font-family="Cascadia Code, Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="21" font-weight="620">
      <rect x="0" y="0" width="138" height="44" rx="8" fill="#171a1d" stroke="#2f343a"/>
      <text x="69" y="29" text-anchor="middle" fill="#c678dd">HOC-first</text>

      <rect x="158" y="0" width="194" height="44" rx="8" fill="#171a1d" stroke="#2f343a"/>
      <text x="255" y="29" text-anchor="middle" fill="#98c379">typed props</text>

      <rect x="372" y="0" width="276" height="44" rx="8" fill="#171a1d" stroke="#2f343a"/>
      <text x="510" y="29" text-anchor="middle" fill="#61afef">async dependencies</text>

      <rect x="65" y="68" width="198" height="44" rx="8" fill="#171a1d" stroke="#2f343a"/>
      <text x="164" y="97" text-anchor="middle" fill="#ffcc66">Suspense-ready</text>

      <rect x="283" y="68" width="300" height="44" rx="8" fill="#171a1d" stroke="#2f343a"/>
      <text x="433" y="97" text-anchor="middle" fill="#e06c75">scoped component trees</text>
