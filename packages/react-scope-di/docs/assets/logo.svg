    <polygon points="250,500 200,500 500,800 675,625 625,625 500,750" fill="black"/>
    <polygon points="150,500 100,500 500,100 900,500 850,500 500,150" fill="black"/>
    <polygon points="150,500 100,500 500,900 900,500 850,500 500,850" fill="black"/>
    <polygon points="0,500 50,500 500,950 950,500 1000,500 500,1000" fill="black"/>
  </g>
</svg>
